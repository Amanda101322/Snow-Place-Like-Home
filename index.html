<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow Place Like Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- snowman welcome overlay -->
    <div id="welcome-overlay" class="welcome-overlay">
        <div class="welcome-card">
            <img class="snowman-avatar" src="snowman.jpg" alt="snowman" />
            <div class="welcome-content">
        <h2>Welcome to Snow Place Like Home!</h2>
        <p id="snowman-greeting">Shake for a little winter kindness</p>
        <button id="enter-btn">Come On In</button>
    </div>
</div>
</div>
    <button id="theme-toggle">☾</button>
    <canvas id="snow-canvas"></canvas>

    <header class="hero">
        <h1>Snow Place Like Home</h1>
        <p class="tagline">Shake for a little winter kindness</p>
        <div class="sound-toggle-container">
            <button id="sound-toggle">Sound On</button>
        </div>
    </header>
    
    <main>
        <section class="globe-card">
            <div class="globe" id="globe">
                <img class="scene" src="snowglobe.png" alt="a big snowglobe" />
            </div>
            <div class="controls">
              <button id="shake">shake the globe</button>
              <div class="warmth-meter">
                <p>Warmth Spread: <span id="counter">0</span> times</p>
              </div>
              <div id="fortune-card" class="fortune-card show">
                <span id="fortune-category" class="category-badge">Your Snowy Fate</span>
                <p id="message" class="fortune-text">Shake the globe to reveal your snowy fate!</p>
              </div>
            </div>
        </section> 
    </main>
    <footer>
        <p>Made by Amanda, from her not so comfy bed</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
