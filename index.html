<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow Place Like Home</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="hero">
        <h1>Snow Place Like Home</h1>
        <p class="tagline">Shake for a little winter kindness</p>
    </header>
    <main>
        <section class="globe-card">
            <div class="globe" id="globe">
                <img class="scene" src="snowglobe.png" alt="a big snowglobe" />
            </div>
            <div class="globe-shaking-control">
              <button id="shake">shake the globe</button>
              <p class="message" id="message">press the button and get your fate told</p>
            </div>
        </section>
    </main>
    <footer>
        <p>Made by Amanda, from her not so comfy bed</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
